# Paid batches (bulk passes): add inside the walletmcppass.com `server { ... }` block next to `location ^~ /api/passes/`,
# then `nginx -t && systemctl reload nginx`. Bodies carry a design (maybe base64 images) + up to 1000 rows.
location ^~ /api/batches {
    client_max_body_size 3m;
    limit_req zone=wm_api burst=20 nodelay;
    proxy_pass http://127.0.0.1:8400;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300s;
}
