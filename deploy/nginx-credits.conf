# Card payments (credits.py): add inside the walletmcppass.com `server { ... }` block next to `location = /api/passes`,
# then `nginx -t && systemctl reload nginx`. /api/credits = buy (POST) / balance (GET); the webhook is Dodo's.
location = /api/credits {
    limit_req zone=wm_api burst=10 nodelay;
    proxy_pass http://127.0.0.1:8400;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
location = /api/dodo/webhook {
    client_max_body_size 1m;
    limit_req zone=wm_api burst=20 nodelay;
    proxy_pass http://127.0.0.1:8400;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
