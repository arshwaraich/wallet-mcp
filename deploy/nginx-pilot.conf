# Organizer pilots: add these location blocks inside the walletmcppass.com `server { ... }` block of
# /etc/nginx/sites-available/walletmcppass (next to `location ^~ /api/passes/`), then `nginx -t && systemctl reload nginx`.
# The landing page owns the rest of /api/, so these are prefix matches on the pilot paths only.

# Pilot REST API. clean takes a CSV up to 2 MB (nginx's default body cap is 1 MB); update rebuilds every pass
# and pushes to devices, which can take a while for 1000+ passes.
location ^~ /api/pilot/ {
    client_max_body_size 3m;
    limit_req zone=wm_api burst=20 nodelay;
    proxy_pass http://127.0.0.1:8400;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300s;
}
# Permanent attendee links: /pass/<serial>/<auth_token>
location ^~ /pass/ {
    limit_req zone=wm_api burst=20 nodelay;
    proxy_pass http://127.0.0.1:8400;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
